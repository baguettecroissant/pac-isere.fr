  <rect x="248" y="168" width="16" height="192" fill="#000000" opacity="0.15"/>
  <rect x="316" y="168" width="16" height="192" fill="#000000" opacity="0.15"/>
  
  <!-- Lift lugs on the sides (steel hooks for chains) -->
  <circle cx="108" cy="240" r="16" fill="#1E293B"/>
  <circle cx="108" cy="240" r="8" fill="#FFFFFF"/>
  
  <circle cx="404" cy="240" r="16" fill="#1E293B"/>
  <circle cx="404" cy="240" r="8" fill="#FFFFFF"/>
